name: Harvest EN strings from visuals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'   # daily
permissions: {}

concurrency:
  group: harvest-en-strings
  cancel-in-progress: false

env:
  BOT_BRANCH: new_translations

jobs:
  update_en_localization:
    environment: update localizations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.LOC_APP_ID }}
          private-key: ${{ secrets.LOC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Configure Git
        run: git config --global core.autocrlf false
      - name: Update submodules
        run: |
          # checkout already cloned and initialized them; --remote moves each one to the head
          # of its own default branch, which is all this job reads.
          git submodule update --remote --recursive
      - name: Copy EN translation
        run: |
          # Without nullglob a pattern that matches nothing is passed through literally.
          shopt -s nullglob
          for file in ./visuals/*/stringResources/en-US/resources.resjson; do
            substring="visuals/"
            target="${file/$substring/localizations/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done
      - name: Commit and open Pull Request
        run: |
          node src/commit-and-open-pr.js \
            --repo "$REPO_OWNER/$REPO_NAME" \
            --branch "$BOT_BRANCH" \
            --message "New translations" \
            --title "New translations from visuals" \
            --body "Auto created Pull Request with new translations" \
            --path localizations
        env:
          REPO_OWNER: 'microsoft'
          REPO_NAME: 'powerbi-visuals-utils-localizationutils'
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
