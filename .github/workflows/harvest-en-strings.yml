name: Harvest EN strings from visuals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'   # daily, ~08:00 Europe/Belgrade; visual repos have no way to notify this repo directly

permissions: {}

concurrency:
  group: harvest-en-strings
  cancel-in-progress: false

env:
  BOT_BRANCH: new_translations

jobs:
  update_en_localization:
    environment: update localizations
    runs-on: ubuntu-latest
    steps:
      - name: Prepare info
        id: info
        run: |
          echo "pr-name=$(date +'New translations (%F %T %Z)')" >> $GITHUB_OUTPUT
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.LOC_APP_ID }}
          private-key: ${{ secrets.LOC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          persist-credentials: true
      - name: Configure Git
        run: git config --global core.autocrlf false
      - name: Update submodules
        run: |
          git submodule init
          git submodule update --remote --recursive
          for folder in visuals/*; do
            git -C $folder config remote.origin.fetch +refs/heads/*:refs/remotes/origin/*
          done;
          git submodule foreach --recursive 'git fetch'
      - name: Copy EN translation
        run: |
          for file in ./visuals/*/stringResources/en-US/resources.resjson; do 
            substring="visuals/"
            location="${file/$substring/localizations/}"
            substring="/stringresources"
            newLocation="${location/$substring//stringResources}"
            test -f $newLocation || mkdir -p ${newLocation%resources.resjson*}
            cp $file $newLocation;
          done;
      - name: Commit and open Pull Request
        run: |
          rc=0
          pwsh scripts/create-signed-commit.ps1 \
            -Repo "$REPO_OWNER/$REPO_NAME" -Branch "$BOT_BRANCH" -Message "New translations" -PathSpec localizations || rc=$?
          if [ $rc -eq 3 ]; then
            echo "No localization changes to commit"
            exit 0
          elif [ $rc -ne 0 ]; then
            exit $rc
          fi
          defaultBranchName=$(gh api "repos/$REPO_OWNER/$REPO_NAME" --jq .default_branch)
          gh pr create --repo "$REPO_OWNER/$REPO_NAME" --head "$BOT_BRANCH" --base "$defaultBranchName" \
            -b "Auto created Pull Request with new translations" -t "$PR_NAME" || \
            echo "Pull request already open on $BOT_BRANCH, or couldn't be created"
        env:
          PR_NAME: ${{steps.info.outputs.pr-name}}
          REPO_OWNER: 'microsoft'
          REPO_NAME: 'powerbi-visuals-utils-localizationutils'
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
