name: Distribute translations to visuals

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Folder name under visuals/ to update on its own, e.g. powerbi-visuals-asterplot. Empty means all.'
        required: false
        type: string
  push:
    branches: [main]
    # Ignore en-US-only harvest merges; target-locale changes signal completed translations.
    paths:
      - 'localizations/**'
      - '!localizations/**/en-US/**'

permissions: {}

concurrency:
  group: distribute-translations
  cancel-in-progress: false

env:
  BOT_BRANCH: new_translations
  ONLY_REPO: ${{ inputs.only }}

jobs:
  update_other_localizations:
    environment: update localizations
    runs-on: ubuntu-latest
    # Below the one hour lifetime of the App token, so the job dies before its credentials do.
    timeout-minutes: 40
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.LOC_APP_ID }}
          private-key: ${{ secrets.LOC_APP_PRIVATE_KEY }}
          # Omit `repositories` so the token has access to every repo in the org
          # where the App is installed (localizationutils + every powerbi-visuals-* submodule).
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Check the requested visual exists
        if: inputs.only != ''
        run: |
          # Otherwise a typo skips every repository and the run still reports success.
          if [ ! -d "visuals/$ONLY_REPO" ]; then
            echo "::error title=Unknown visual::No visuals/$ONLY_REPO in this repository"
            exit 1
          fi
      - name: Configure Git
        run: git config --global core.autocrlf false
      - name: Update submodules
        run: |
          # checkout already cloned and initialized them; --remote moves each one to the head
          # of its own default branch, and the refspec makes other branches fetchable.
          git submodule update --remote --recursive
          for folder in visuals/*; do
            git -C "$folder" config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          done
          git submodule foreach --recursive 'git fetch'
      - name: Copy translations to submodules
        run: |
          # Without nullglob a pattern that matches nothing is passed through literally.
          shopt -s nullglob
          for visualPath in ./localizations/*; do 
            repoName=$(echo $visualPath| cut -d'/' -f 3)
            if [ -n "$ONLY_REPO" ] && [ "$repoName" != "$ONLY_REPO" ]; then
              continue
            fi
            echo "::group::Copy to $repoName"
              sourceRoot="$visualPath/stringResources"
              targetRoot="visuals/$repoName/stringResources"
              mkdir -p "$targetRoot"
              # en-US is owned by the visual repo; copying it back would revert strings added since the last harvest.
              for existing in "$targetRoot"/*/; do
                if [ -d "$existing" ] && [ "$(basename "$existing")" != "en-US" ]; then
                  rm -rf "$existing"
                fi
              done
              for localePath in "$sourceRoot"/*/; do
                locale=$(basename "$localePath")
                if [ -d "$localePath" ] && [ "$locale" != "en-US" ]; then
                  cp -r "$localePath" "$targetRoot/$locale"
                fi
              done
            echo "::endgroup::"
          done;
      - name: Update visual repositories
        run: |
          shopt -s nullglob
          mainFolder=$PWD
          failedRepos=()
          for folder in visuals/*; do
            repoName=$(echo $folder| cut -d'/' -f 2)
            if [ -n "$ONLY_REPO" ] && [ "$repoName" != "$ONLY_REPO" ]; then
              continue
            fi
            # Asks the source, not the target: the copy step above creates the target directory,
            # so checking it would only ever detect visuals missing from localizations/.
            if [ ! -d "$mainFolder/localizations/$repoName/stringResources" ]; then
              echo "No localizations for $repoName, skipping"
              continue
            fi
            echo "::group::Commit to $repoName"  
              cd "$mainFolder/$folder"
              changedFiles="$(git diff --name-only)"
              if [[ $changedFiles != "" ]]; then
                while IFS= read -r filePath; do
                  if git diff --ignore-cr-at-eol --quiet -- "$filePath"; then
                    git checkout -- "$filePath"
                  fi
                done <<< "$changedFiles"
              fi
              # No --base: submodules sit on a detached HEAD, so the script resolves the
              # target's default branch through the API instead.
              if ! node "$mainFolder/src/commit-and-open-pr.js" \
                --repo "$REPO_OWNER/$repoName" \
                --branch "$BOT_BRANCH" \
                --message "New translations" \
                --title "New translations" \
                --body "Auto created Pull Request with new translations" \
                --path stringResources \
                --exclude stringResources/en-US; then
                echo "::error title=Update failed::$repoName could not be updated"
                failedRepos+=("$repoName")
              fi
            echo "::endgroup::"
          done;
          if (( ${#failedRepos[@]} > 0 )); then
            failedList=$(IFS=,; echo "${failedRepos[*]}")
            echo "::error title=Translation distribution incomplete::Failed repositories: $failedList"
            exit 1
          fi
        env:
          REPO_OWNER: 'microsoft'
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
