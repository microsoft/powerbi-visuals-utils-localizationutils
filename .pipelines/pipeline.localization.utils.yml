# batch keeps two pushes to main from racing for the same bot branch.
trigger:
  batch: true
  branches:
    include:
      - main

variables:
  - name: branchRef
    value: 'main'
  - name: locBranchName
    value: 'parsed_localizations'

stages:
- stage: build
  jobs:
  - job: main
    pool:
      vmImage: 'windows-latest'

    steps:
      - checkout: self
        persistCredentials: true
      - task: UseNode@1
        inputs:
          version: '20.x'
        displayName: 'Install Node.js'
      - script: |
          git config --global core.autocrlf false
        displayName: 'Configure Git'
      - task: OneLocBuild@2
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        inputs:
          locProj: 'LocProject.json'
          outDir: '$(Build.SourcesDirectory)'
          isCreatePrSelected: true
          repoType: 'gitHub'
          prSourceBranchPrefix: 'locfiles'
          dependencyPackageSource: 'https://powerbi.pkgs.visualstudio.com/PowerBIClients/_packaging/VisualsMonitorFeed/nuget/v3/index.json'
          packageSourceAuth: 'patAuth'
        displayName: 'Run OneLocBuild'
      - script: npm run parseNewLocalizations
        displayName: 'Parse new localizations'
      - script: git status --short
        displayName: 'Git status'
      # Minted after OneLocBuild, not with the other setup tasks: the token lasts an hour
      # and OneLocBuild can run for longer than that.
      - task: AzureKeyVault@2
        inputs:
          azureSubscription: 'CustomVisualsASPManagedIdentity'
          KeyVaultName: 'CustomVisualsKeyVault'
          SecretsFilter: 'LOC-APP-ID,LOC-APP-PRIVATE-KEY'
          RunAsPreJob: false
        displayName: 'Fetch GitHub App credentials from Key Vault'
      - task: PowerShell@2
        displayName: 'Generate GitHub App Access Token'
        name: getGitHubToken
        inputs:
          targetType: 'filePath'
          filePath: '.pipelines/get-github-app-token.ps1'
          arguments: >-
            -AppId "$(LOC-APP-ID)"
            -RepoOwner "microsoft"
            -RepoName "powerbi-visuals-utils-localizationutils"
            -OutputVariableName "LOC_APP_TOKEN"
          pwsh: true
        env:
          GITHUB_APP_PRIVATE_KEY: $(LOC-APP-PRIVATE-KEY)
      - pwsh: |
          node src/commit-and-open-pr.js `
            --repo "microsoft/powerbi-visuals-utils-localizationutils" `
            --branch "$(locBranchName)" `
            --message "Update localizations" `
            --title "Update localizations" `
            --body "Automated PR to update localizations" `
            --base "$(branchRef)" `
            --path localizations
          if ($LASTEXITCODE -ne 0) { throw 'Failed to update localizations' }
        displayName: 'Commit localizations and open pull request'
        env:
          GH_TOKEN: $(LOC_APP_TOKEN)
      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Build.SourcesDirectory)'
          artifact: 'drop'
          publishLocation: 'pipeline'
        displayName: 'Publish Pipeline Artifact'
